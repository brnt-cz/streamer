<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#F02F00"/>
  <g transform="translate(256, 256) scale(0.55)" fill="none" stroke="white" stroke-width="20" stroke-linecap="round">
    <!-- Radio body -->
    <rect x="-140" y="-60" width="280" height="180" rx="24"/>
    <!-- Speaker circle -->
    <circle cx="-60" cy="40" r="50"/>
    <circle cx="-60" cy="40" r="25"/>
    <!-- Display lines -->
    <line x1="20" y1="0" x2="120" y2="0"/>
    <line x1="20" y1="35" x2="120" y2="35"/>
    <line x1="20" y1="70" x2="80" y2="70"/>
    <!-- Antennas -->
    <line x1="-80" y1="-60" x2="-40" y2="-120"/>
    <line x1="80" y1="-60" x2="40" y2="-120"/>
  </g>
</svg>
